# dsh-thin-search v1.0.0 — free web search (no API key, no model tokens by default)
#
# This bundle inserts the Thin Search plugin row and points the web capability
# seam at its provider. The web row is a replacement patch: only the two
# volatile provider fields are set here, and fetchProvider keeps the built-in
# HTTP fetch provider registered. Provider switching after mount is done by the
# Client through ConfigForms.get('web').set('searchProvider', id); this file is
# the first-boot default, not a profile rewrite.
- insert:
    - id: thin-search
      name: dsh-thin-search
      config:
        provider: bing
        bingMarket: zh-CN
- id: web
  config:
    searchProvider: thin-search
    fetchProvider: http
